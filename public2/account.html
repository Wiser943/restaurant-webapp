<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Account — Mama Tolu's Kitchen</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#16120e" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>
  <script src="/js/ui.js"></script>
  <div id="topbar"></div>

  <div class="container" style="padding-top: 12px; max-width: 420px;">
    <div id="account-content"><p class="helper-text">Loading…</p></div>
  </div>

  <div id="tabbar"></div>

  <script src="js/api.js"></script>
  <script src="js/push.js"></script>
  <script src="js/nav.js"></script>
  <script>
    async function loadAccount() {
      let user;
      try { user = (await api.get('/auth/me')).user; }
      catch (e) { window.location.href = 'login.html?next=account.html'; return; }

      document.getElementById('account-content').innerHTML = `
        <p class="eyebrow">Your account</p>
        <h1 class="display" style="margin-bottom:20px;">${user.name}</h1>
        <div class="card" style="padding:20px; margin-bottom:20px;">
          <p style="margin:4px 0;"><strong>Email:</strong> ${user.email}</p>
          ${user.phone ? `<p style="margin:4px 0;"><strong>Phone:</strong> ${user.phone}</p>` : ''}
        </div>
        ${user.role === 'admin' ? `<a href="/admin" class="btn btn-ghost btn-block" style="margin-bottom:12px;">Go to admin dashboard</a>` : ''}
        <a href="support.html" class="btn btn-ghost btn-block" style="margin-bottom:12px;">Contact support</a>
        <button class="btn btn-danger btn-block" id="logout-btn">Log out</button>
      `;

      document.getElementById('logout-btn').addEventListener('click', async () => {
        await api.post('/auth/logout', {});
        window.location.href = 'index.html';
      });
    }
    loadAccount();
  </script>
</body>
</html>
