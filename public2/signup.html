<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign up — Mama Tolu's Kitchen</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#16120e" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>
  <script src="/js/ui.js"></script>
  <div class="auth-page">
    <p class="eyebrow">Join us</p>
    <h1 class="display" style="margin-bottom: 20px;">Create an account</h1>

    <form id="signup-form" class="card auth-card">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" required placeholder="Your name" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com" />
      </div>
      <div class="field">
        <label for="phone">Phone (optional)</label>
        <input type="tel" id="phone" placeholder="080..." />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6" placeholder="At least 6 characters" />
      </div>
      <p class="error-text" id="error-text" style="display:none;"></p>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    <p class="auth-switch"><a href="index.html">← Back to the menu</a></p>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorText = document.getElementById('error-text');
      const btn = document.getElementById('submit-btn');
      errorText.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Creating account…';
      try {
        await api.post('/auth/signup', {
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          phone: document.getElementById('phone').value,
          password: document.getElementById('password').value,
        });
        window.location.href = 'index.html';
      } catch (err) {
        errorText.textContent = err.message;
        errorText.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Create account';
      }
    });
  </script>
</body>
</html>
