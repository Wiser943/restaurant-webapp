<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in — Mama Tolu's Kitchen</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#16120e" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>
  <script src="/js/ui.js"></script>
  <div class="auth-page">
    <p class="eyebrow">Welcome back</p>
    <h1 class="display" style="margin-bottom: 20px;">Log in</h1>

    <form id="login-form" class="card auth-card">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••" />
      </div>
      <p class="error-text" id="error-text" style="display:none;"></p>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log in</button>
    </form>

    <p class="auth-switch">New here? <a href="signup.html">Create an account</a></p>
    <p class="auth-switch"><a href="index.html">← Back to the menu</a></p>
  </div>

  <script src="js/api.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const next = params.get('next') || 'index.html';

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorText = document.getElementById('error-text');
      const btn = document.getElementById('submit-btn');
      errorText.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Logging in…';
      try {
        const { user } = await api.post('/auth/login', {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        });
        if (user.role === 'admin') window.location.href = params.get('next') || '/admin/index.html';
        else if (user.role === 'supplier') window.location.href = params.get('next') || '/supplier/index.html';
        else window.location.href = next;
      } catch (err) {
        errorText.textContent = err.message;
        errorText.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Log in';
      }
    });
  </script>
</body>
</html>
