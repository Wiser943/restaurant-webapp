<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    // Apply the saved theme before first paint, so there's no flash of the
    // wrong theme. Full toggle logic lives in /js/theme.js.
    (function () {
      try {
        if (localStorage.getItem('vck_theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
  <title>Your Cart — VC Kitchen</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#16120e" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>
  <script src="/js/ui.js"></script>
  <script src="/js/theme.js"></script>
  <div id="topbar"></div>

  <div class="container" style="padding-top: 12px;">
    <p class="eyebrow">Before you order</p>
    <h1 class="display" style="margin-bottom: 20px;">Your cart</h1>
    <div id="cart-content"><p class="helper-text">Loading your cart…</p></div>
  </div>

  <div id="tabbar"></div>

  <script src="js/api.js"></script>
  <script src="js/push.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/cart-page.js"></script>
</body>
</html>
