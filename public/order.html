<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    // Apply the saved theme before first paint, so there's no flash of the
    // wrong theme. Full toggle logic lives in /js/theme.js.
    (function () {
      try {
        if (localStorage.getItem('vck_theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
  <title>Order Status — VC Kitchen</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#16120e" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>
  <script src="/js/ui.js"></script>
  <script src="/js/theme.js"></script>
  <div id="topbar"></div>

  <div class="container" data-w="sm" style="padding-top: 12px; max-width: 480px;">
    <div id="order-content">
      <div class="skeleton skeleton-block" style="height:90px;"></div>
      <div class="skeleton skeleton-block" style="height:140px;"></div>
      <div class="skeleton skeleton-block" style="height:110px;"></div>
    </div>
  </div>

  <div id="tabbar"></div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/push.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/imgbb.js"></script>
  <script src="js/order-detail.js"></script>
</body>
</html>
