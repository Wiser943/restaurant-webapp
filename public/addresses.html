<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    // Apply the saved theme before first paint, so there's no flash of the
    // wrong theme. Full toggle logic lives in /js/theme.js.
    (function () {
      try {
        if (localStorage.getItem('vck_theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
  <title>My Addresses — VC Kitchen</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#16120e" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/profile.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>
  <script src="/js/ui.js"></script>
  <script src="/js/theme.js"></script>
  <div id="topbar"></div>

  <div class="container" data-w="sm" style="padding-top: 12px; max-width: 520px;">
    <button class="profile-icon-btn" onclick="history.back()" style="margin-bottom:10px;"><i class="fa-solid fa-chevron-left"></i></button>
    <p class="eyebrow">Delivery</p>
    <h1 class="display" style="margin-bottom: 20px;">My Addresses</h1>
    <div id="addresses-content"><p class="helper-text">Loading…</p></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/addresses-page.js"></script>
</body>
</html>
