<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    (function () {
      try {
        if (localStorage.getItem('vck_theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
  <title>Admin · Reviews — VC Kitchen</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="/css/profile.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body style="padding-bottom: 40px;">
  <script src="/js/ui.js"></script>
  <script src="/js/theme.js"></script>
  <div id="admin-nav"></div>

  <div class="container" data-w="sm" style="padding-top: 12px; max-width: 620px;">
    <h1 class="display" style="margin-bottom:16px;">Reviews</h1>
    <p class="helper-text" style="margin-bottom:16px;">Hide or remove reviews that don't belong on the menu.</p>

    <div class="filter-chip-row" id="review-tabs" style="margin-bottom:16px;"></div>
    <div id="review-list"><p class="helper-text">Loading…</p></div>
  </div>

  <script src="/admin/js/api.js"></script>
  <script src="/js/push.js"></script>
  <script src="/admin/js/admin-nav.js"></script>
  <script src="/admin/js/admin-reviews.js"></script>
</body>
</html>
