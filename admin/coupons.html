<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    // Apply the saved theme before first paint, so there's no flash of the
    // wrong theme. Full toggle logic lives in /js/theme.js.
    (function () {
      try {
        if (localStorage.getItem('vck_theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
  <title>Admin · Coupons — VC Kitchen</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="/css/profile.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body style="padding-bottom: 40px;">
  <script src="/js/ui.js"></script>
  <script src="/js/theme.js"></script>
  <div id="admin-nav"></div>

  <div class="container" data-w="sm" style="padding-top: 12px; max-width: 560px;">
    <h1 class="display" style="margin-bottom:16px;">Promo codes</h1>
    <p class="helper-text" style="margin-bottom:16px;">Codes customers can enter at checkout for a discount.</p>

    <button class="btn btn-primary btn-sm" id="new-coupon-btn" style="margin-bottom:16px;">+ New code</button>
    <div id="coupon-form-wrap"></div>
    <div id="coupon-list"><p class="helper-text">Loading…</p></div>
  </div>

  <script src="/admin/js/api.js"></script>
  <script src="/js/push.js"></script>
  <script src="/admin/js/admin-nav.js"></script>
  <script src="/admin/js/admin-coupons.js"></script>
</body>
</html>
