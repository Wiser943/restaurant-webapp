<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    // Apply the saved theme before first paint, so there's no flash of the
    // wrong theme. Full toggle logic lives in /js/theme.js.
    (function () {
      try {
        if (localStorage.getItem('vck_theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
  <title>Admin · Users — VC Kitchen</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="/css/profile.css" />
  <link rel="stylesheet" href="css/users.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body style="padding-bottom: 40px;">
  <script src="/js/ui.js"></script>
  <script src="/js/theme.js"></script>
  <div id="admin-nav"></div>

  <div class="container users-page" data-w="lg" style="padding-top: 12px; max-width: 1100px;">
    <div class="users-header">
      <div>
        <h1 class="display" style="margin:0;">Users Management</h1>
        <p class="helper-text" style="margin:4px 0 0;">Manage and monitor all registered users and delivery suppliers</p>
      </div>
    </div>

    <div class="stat-cards" id="stat-cards">
      <p class="helper-text">Loading stats…</p>
    </div>

    <div class="users-toolbar">
      <div class="search-field">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="search-input" placeholder="Search by name, email, or phone…" />
      </div>
      <div class="toolbar-filters">
        <select id="role-filter" class="field">
          <option value="">All roles</option>
          <option value="customer">Customers</option>
          <option value="supplier">Suppliers</option>
        </select>
        <select id="status-filter" class="field">
          <option value="">Any status</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
        <button class="btn btn-primary btn-sm" id="export-btn"><i class="fa-solid fa-download"></i> Export</button>
      </div>
    </div>

    <div class="card users-table-card">
      <div class="users-table-head">
        <p class="eyebrow" id="results-count">All Users</p>
        <select id="sort-select" class="field" style="margin:0; width:auto;">
          <option value="newest">Sort: Newest</option>
          <option value="oldest">Sort: Oldest</option>
          <option value="name">Sort: Name (A–Z)</option>
        </select>
      </div>

      <div id="users-table-wrap">
        <p class="helper-text" style="padding:20px;">Loading users…</p>
      </div>

      <div class="users-pagination" id="pagination"></div>
    </div>
  </div>

  <script src="/admin/js/api.js"></script>
  <script src="/js/push.js"></script>
  <script src="/admin/js/admin-nav.js"></script>
  <script src="/admin/js/admin-users.js"></script>
</body>
</html>
